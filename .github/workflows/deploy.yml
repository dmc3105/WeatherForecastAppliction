name: Deploy to Cloud

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-app \
          -f ./WeatherForecastAppliction/Dockerfile \
          .

      - name: Push image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-app