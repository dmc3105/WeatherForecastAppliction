name: Deploy to Cloud

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-app \
          -f ./WeatherForecastAppliction/Dockerfile \
          .

      - name: Push image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-app

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: ssh deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-app:latest
            
            docker stop weather-forecast-app || true
            docker rm weather-forecast-app || true

            docker run -d \
              --name weather-forecast-app \
              --restart unless-stopped \
              -p 80:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-app:latest